minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
saveExact: true

overrides:
  brace-expansion: '5.0.9'
  fast-uri: '3.1.5'
  ip-address: '10.3.1'
  'js-yaml@3': '3.15.1'
  'js-yaml@4': '4.3.1'
  'nanoid@3': '3.3.17'
  postcss: '8.5.23'
  tmp: '0.2.7'
  uuid: '11.1.1'

allowBuilds:
  esbuild: true

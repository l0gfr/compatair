minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'semver@5.7.2'
  - 'semver@6.3.1'
blockExoticSubdeps: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
saveExact: true

overrides:
  '@puppeteer/browsers': '3.2.0'
  brace-expansion: '5.0.9'
  fast-uri: '3.1.6'
  ip-address: '10.3.1'
  'js-yaml@3': '3.15.1'
  'js-yaml@4': '4.3.1'
  'nanoid@3': '3.3.18'
  postcss: '8.5.23'
  qs: '6.16.0'
  tmp: '0.2.7'
  uuid: '11.1.1'

allowBuilds:
  esbuild: true

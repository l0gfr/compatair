<VirtualHost *:80>
    ServerName compatair.fr
    ServerAlias www.compatair.fr
    DocumentRoot /var/www/html/compatair/current

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/compatair/current>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/compatair-error.log
    CustomLog ${APACHE_LOG_DIR}/compatair-access.log combined
</VirtualHost>

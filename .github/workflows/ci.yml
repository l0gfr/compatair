name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_preview:
        description: Conserver une archive du site pendant 2 jours
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Install pnpm
        run: npm install --global --ignore-scripts pnpm@10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity and install-script policy
        run: pnpm security:supply-chain

      - name: Lint source and workflow policy
        run: pnpm lint:source

      - name: Validate source, tests, build and snapshots
        run: pnpm validate:full

      - name: Preserve source versions already published on the PR base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git show "${PR_BASE_SHA}:src/data/evidence-history.snapshot.json" > /tmp/evidence-baseline.json
          git show "${PR_BASE_SHA}:src/data/document-quality-observatory-history.snapshot.json" > /tmp/observatory-baseline.json
          node scripts/assert-evidence-history-extension.mjs /tmp/evidence-baseline.json dist/data/evidence-history.json
          node scripts/assert-observatory-history-extension.mjs /tmp/observatory-baseline.json dist/data/document-quality-observatory.json

      - name: Audit production dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm security:audit

      - name: Check generated HTML and internal links
        run: node scripts/audit-dist.mjs

      - name: Select the hosted Chrome browser
        run: |
          chrome_path=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Lighthouse performance, accessibility and SEO
        run: pnpm lighthouse

      - name: Summarize Lighthouse laboratory metrics
        run: pnpm lighthouse:summary

      - name: Upload compact Lighthouse summary
        if: ${{ always() && hashFiles('.lighthouseci/reports/summary.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-summary-${{ github.sha }}
          path: |
            .lighthouseci/reports/summary.json
            .lighthouseci/reports/crux-summary.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Upload full Lighthouse diagnostics on failure
        if: ${{ failure() && hashFiles('.lighthouseci/reports/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci/reports/
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Upload requested site preview
        if: github.event_name == 'workflow_dispatch' && inputs.upload_preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatair-preview-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

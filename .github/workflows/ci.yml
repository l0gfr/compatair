name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Install pnpm
        run: npm install --global --ignore-scripts pnpm@10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity and install-script policy
        run: pnpm security:supply-chain

      - name: Lint source and workflow policy
        run: pnpm lint:source

      - name: Validate source, tests, build and snapshots
        run: pnpm validate:full

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Check generated HTML and internal links
        run: node scripts/audit-dist.mjs

      - name: Select the hosted Chrome browser
        run: |
          chrome_path=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Lighthouse performance, accessibility and SEO
        run: pnpm lighthouse

      - name: Summarize Lighthouse laboratory metrics
        run: pnpm lighthouse:summary

      - name: Upload Lighthouse reports
        if: ${{ always() && hashFiles('.lighthouseci/reports/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci/reports/
          if-no-files-found: error
          retention-days: 7

      - name: Upload pull request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatair-preview-${{ github.event.pull_request.number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: Autoriser une restauration si les invariants live sont indisponibles
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Install pnpm
        run: npm install --global --ignore-scripts pnpm@10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity and install-script policy
        run: pnpm security:supply-chain

      - name: Lint source and workflow policy
        run: pnpm lint:source

      - name: Validate source, tests, build and snapshots
        env:
          COMPATAIR_RELEASE_SHA: ${{ github.sha }}
        run: pnpm validate:full

      - name: Enforce repository append-only baseline
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          previous_sha="$PUSH_BASE_SHA"
          if [[ -z "$previous_sha" || "$previous_sha" =~ ^0+$ ]]; then
            previous_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${previous_sha}:src/data/evidence-history.snapshot.json"
          git show "${previous_sha}:src/data/evidence-history.snapshot.json" > previous-repository-evidence-history.json
          node scripts/assert-evidence-history-extension.mjs previous-repository-evidence-history.json dist/data/evidence-history.json
          if git cat-file -e "${previous_sha}:src/data/document-quality-observatory-history.snapshot.json"; then
            git show "${previous_sha}:src/data/document-quality-observatory-history.snapshot.json" > previous-repository-observatory-history.json
          else
            echo '{}' > previous-repository-observatory-history.json
          fi
          node scripts/assert-observatory-history-extension.mjs previous-repository-observatory-history.json dist/data/document-quality-observatory.json

      - name: Fetch current production invariants
        id: production-invariants
        env:
          RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_mode || false }}
        run: |
          available=true
          if ! curl --fail --silent --show-error --max-time 20 https://compatair.fr/data/evidence-history.json -o previous-evidence-history.json ||
             ! curl --fail --silent --show-error --max-time 20 https://compatair.fr/widget/v1.0.0/compatair-widget.js -o previous-compatair-widget.js ||
             ! curl --fail --silent --show-error --max-time 20 https://compatair.fr/data/document-quality-observatory.json -o previous-document-quality-observatory.json; then
            rm -f previous-evidence-history.json previous-compatair-widget.js previous-document-quality-observatory.json
            if [[ "$RECOVERY_MODE" != "true" ]]; then
              echo "::error::Les invariants live sont indisponibles. Utiliser recovery_mode uniquement pour une restauration manuelle approuvée." >&2
              exit 1
            fi
            available=false
            echo "::warning::Mode récupération actif : la référence Git et les empreintes épinglées restent obligatoires, les comparaisons live sont ignorées."
          fi
          current_widget_available=false
          if curl --fail --silent --show-error --max-time 20 https://compatair.fr/widget/v1.1.0/compatair-widget.js -o previous-compatair-widget-v1.1.0.js; then
            current_widget_available=true
          else
            rm -f previous-compatair-widget-v1.1.0.js
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "current_widget_available=$current_widget_available" >> "$GITHUB_OUTPUT"

      - name: Enforce live append-only evidence history
        if: steps.production-invariants.outputs.available == 'true'
        run: node scripts/assert-evidence-history-extension.mjs previous-evidence-history.json dist/data/evidence-history.json

      - name: Enforce live append-only observatory history
        if: steps.production-invariants.outputs.available == 'true'
        run: node scripts/assert-observatory-history-extension.mjs previous-document-quality-observatory.json dist/data/document-quality-observatory.json

      - name: Enforce immutable live widget
        if: steps.production-invariants.outputs.available == 'true'
        run: cmp --silent previous-compatair-widget.js dist/widget/v1.0.0/compatair-widget.js

      - name: Enforce current immutable live widget
        if: steps.production-invariants.outputs.current_widget_available == 'true'
        run: cmp --silent previous-compatair-widget-v1.1.0.js dist/widget/v1.1.0/compatair-widget.js

      - name: Sign published data snapshots
        env:
          COMPATAIR_PUBLICATION_SIGNING_KEY: ${{ secrets.COMPATAIR_PUBLICATION_SIGNING_KEY }}
          COMPATAIR_PUBLICATION_SIGNING_KEY_ID: compatair-2026-01
          COMPATAIR_PUBLICATION_CREATED_AT: ${{ github.event.head_commit.timestamp || github.run_started_at }}
        run: |
          test -n "$COMPATAIR_PUBLICATION_SIGNING_KEY"
          pnpm data:sign
          pnpm data:verify-signatures

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Check generated HTML and internal links
        run: node scripts/audit-dist.mjs

      - name: Select the hosted Chrome browser
        run: |
          chrome_path=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Lighthouse performance, accessibility and SEO
        run: pnpm lighthouse:production

      - name: Summarize Lighthouse laboratory metrics
        run: pnpm lighthouse:summary

      - name: Collect field Core Web Vitals status
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: pnpm crux:report

      - name: Upload Lighthouse reports
        if: ${{ always() && hashFiles('.lighthouseci/reports/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-production-${{ github.sha }}
          path: .lighthouseci/reports/
          if-no-files-found: error
          retention-days: 7

      - name: Package immutable release
        run: |
          install -d -m 755 dist/_server
          install -m 644 server/*.mjs dist/_server/
          install -D -m 644 scripts/generate-private-weekly-report.mjs dist/_ops/generate-private-weekly-report.mjs
          install -D -m 644 scripts/lib/rank-demand.mjs dist/_ops/lib/rank-demand.mjs
          install -D -m 644 scripts/lib/report-product-funnel.mjs dist/_ops/lib/report-product-funnel.mjs
          install -D -m 644 scripts/lib/report-acquisition.mjs dist/_ops/lib/report-acquisition.mjs
          tar -C dist -czf "compatair-${GITHUB_SHA}.tar.gz" .
          sha256sum "compatair-${GITHUB_SHA}.tar.gz" > "compatair-${GITHUB_SHA}.tar.gz.sha256"
          tar -czf "compatair-admin-${GITHUB_SHA}.tar.gz" \
            deploy \
            scripts/smoke-live-http.mjs \
            scripts/verify-live-seo.mjs \
            scripts/lib/live-seo-verification.mjs \
            scripts/lib/markup-text.mjs
          sha256sum "compatair-admin-${GITHUB_SHA}.tar.gz" > "compatair-admin-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatair-production-${{ github.sha }}
          path: |
            compatair-${{ github.sha }}.tar.gz
            compatair-${{ github.sha }}.tar.gz.sha256
            compatair-admin-${{ github.sha }}.tar.gz
            compatair-admin-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOCK_PORTS: ${{ secrets.DEPLOY_KNOCK_PORTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_KNOCK_PORTS" =~ ^[0-9]{1,5}(\ [0-9]{1,5})*$ ]]
          [[ "$DEPLOY_PATH" == "/var/www/html/compatair" ]]
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_dir="/home/${DEPLOY_USER}/compatair-deploy"

          knock_server() {
            read -ra knock_ports <<< "$DEPLOY_KNOCK_PORTS"
            for port in "${knock_ports[@]}"; do
              nc -z -w 1 "$DEPLOY_HOST" "$port" || true
              sleep 1
            done
          }

          retry_after_knock() {
            local label=$1
            shift
            for attempt in 1 2 3; do
              knock_server
              if "$@"; then
                return 0
              fi
              if (( attempt == 3 )); then
                echo "::error::${label} a échoué après ${attempt} tentatives de port-knocking et connexion." >&2
                return 1
              fi
              echo "::warning::${label} a échoué à la tentative ${attempt}; nouvel essai avec une séquence de port-knocking fraîche." >&2
              sleep $((attempt * 5))
            done
          }

          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          scp_options=(-i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)

          retry_after_knock "Préparation du répertoire distant" ssh "${ssh_options[@]}" "$remote" "install -d -m 700 '$remote_dir'"
          retry_after_knock "Transfert des archives" scp "${scp_options[@]}" \
            "compatair-${GITHUB_SHA}.tar.gz" "compatair-${GITHUB_SHA}.tar.gz.sha256" \
            "compatair-admin-${GITHUB_SHA}.tar.gz" "compatair-admin-${GITHUB_SHA}.tar.gz.sha256" \
            scripts/deploy-remote.sh \
            "${remote}:${remote_dir}/"
          retry_after_knock "Activation de la release" ssh "${ssh_options[@]}" "$remote" \
            "cd '$remote_dir' && sha256sum --check 'compatair-admin-${GITHUB_SHA}.tar.gz.sha256' && tar -xzf 'compatair-admin-${GITHUB_SHA}.tar.gz' && bash '$remote_dir/deploy-remote.sh' '$remote_dir/compatair-${GITHUB_SHA}.tar.gz' '$remote_dir/compatair-${GITHUB_SHA}.tar.gz.sha256' '$DEPLOY_PATH' '$GITHUB_SHA'"

      - name: Verify live HTTPS surface
        env:
          COMPATAIR_EXPECTED_RELEASE_SHA: ${{ github.sha }}
          MCP_ENABLED: ${{ vars.MCP_ENABLED }}
        run: |
          node scripts/smoke-live-http.mjs
          node scripts/verify-live-seo.mjs

      - name: Notify IndexNow of changed canonical URLs
        env:
          INDEXNOW_BASE_SHA: ${{ github.event.before }}
        run: pnpm indexnow:submit

      - name: Archive signed production invariants
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatair-invariants-${{ github.sha }}
          path: |
            dist/data/evidence-history.json
            dist/data/release.json
            dist/data/signatures.json
            dist/data/signing-keys.json
            dist/widget/v1.0.0/compatair-widget.js
            dist/widget/v1.1.0/compatair-widget.js
            config/immutable-assets.json
          if-no-files-found: error
          retention-days: 90
    environment:
      name: production
      url: https://compatair.fr

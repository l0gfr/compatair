name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: Autoriser une restauration si les invariants live sont indisponibles
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Install pnpm
        run: npm install --global --ignore-scripts pnpm@10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity and install-script policy
        run: pnpm security:supply-chain

      - name: Lint source and workflow policy
        run: pnpm lint:source

      - name: Validate source, tests, build and snapshots
        run: pnpm validate:full

      - name: Enforce repository append-only baseline
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          previous_sha="$PUSH_BASE_SHA"
          if [[ -z "$previous_sha" || "$previous_sha" =~ ^0+$ ]]; then
            previous_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${previous_sha}:src/data/evidence-history.snapshot.json"
          git show "${previous_sha}:src/data/evidence-history.snapshot.json" > previous-repository-evidence-history.json
          node scripts/assert-evidence-history-extension.mjs previous-repository-evidence-history.json dist/data/evidence-history.json

      - name: Fetch current production invariants
        id: production-invariants
        env:
          RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_mode || false }}
        run: |
          available=true
          if ! curl --fail --silent --show-error --max-time 20 https://compatair.fr/data/evidence-history.json -o previous-evidence-history.json ||
             ! curl --fail --silent --show-error --max-time 20 https://compatair.fr/widget/v1.0.0/compatair-widget.js -o previous-compatair-widget.js; then
            rm -f previous-evidence-history.json previous-compatair-widget.js
            if [[ "$RECOVERY_MODE" != "true" ]]; then
              echo "::error::Les invariants live sont indisponibles. Utiliser recovery_mode uniquement pour une restauration manuelle approuvée." >&2
              exit 1
            fi
            available=false
            echo "::warning::Mode récupération actif : la référence Git et les empreintes épinglées restent obligatoires, les comparaisons live sont ignorées."
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Enforce live append-only evidence history
        if: steps.production-invariants.outputs.available == 'true'
        run: node scripts/assert-evidence-history-extension.mjs previous-evidence-history.json dist/data/evidence-history.json

      - name: Enforce immutable live widget
        if: steps.production-invariants.outputs.available == 'true'
        run: cmp --silent previous-compatair-widget.js dist/widget/v1.0.0/compatair-widget.js

      - name: Sign published data snapshots
        env:
          COMPATAIR_PUBLICATION_SIGNING_KEY: ${{ secrets.COMPATAIR_PUBLICATION_SIGNING_KEY }}
          COMPATAIR_PUBLICATION_SIGNING_KEY_ID: compatair-2026-01
          COMPATAIR_PUBLICATION_CREATED_AT: ${{ github.event.head_commit.timestamp || github.run_started_at }}
        run: |
          test -n "$COMPATAIR_PUBLICATION_SIGNING_KEY"
          pnpm data:sign
          pnpm data:verify-signatures

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Check generated HTML and internal links
        run: node scripts/audit-dist.mjs

      - name: Lighthouse performance, accessibility and SEO
        run: pnpm lighthouse

      - name: Package immutable release
        run: |
          install -D -m 644 server/mcp-core.mjs dist/_server/mcp-core.mjs
          install -D -m 644 server/demand-aggregates.mjs dist/_server/demand-aggregates.mjs
          install -D -m 644 server/product-funnel-aggregates.mjs dist/_server/product-funnel-aggregates.mjs
          install -D -m 644 server/mcp-server.mjs dist/_server/mcp-server.mjs
          tar -C dist -czf "compatair-${GITHUB_SHA}.tar.gz" .
          sha256sum "compatair-${GITHUB_SHA}.tar.gz" > "compatair-${GITHUB_SHA}.tar.gz.sha256"
          tar -czf "compatair-admin-${GITHUB_SHA}.tar.gz" deploy
          sha256sum "compatair-admin-${GITHUB_SHA}.tar.gz" > "compatair-admin-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatair-production-${{ github.sha }}
          path: |
            compatair-${{ github.sha }}.tar.gz
            compatair-${{ github.sha }}.tar.gz.sha256
            compatair-admin-${{ github.sha }}.tar.gz
            compatair-admin-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOCK_PORTS: ${{ secrets.DEPLOY_KNOCK_PORTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_KNOCK_PORTS" =~ ^[0-9]{1,5}(\ [0-9]{1,5})*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/var/www/html/[A-Za-z0-9._/-]+$ ]]
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_dir="/home/${DEPLOY_USER}/compatair-deploy"

          knock_server() {
            read -ra knock_ports <<< "$DEPLOY_KNOCK_PORTS"
            for port in "${knock_ports[@]}"; do
              nc -z -w 1 "$DEPLOY_HOST" "$port" || true
              sleep 1
            done
          }

          retry_after_knock() {
            local label=$1
            shift
            for attempt in 1 2 3; do
              knock_server
              if "$@"; then
                return 0
              fi
              if (( attempt == 3 )); then
                echo "::error::${label} a échoué après ${attempt} tentatives de port-knocking et connexion." >&2
                return 1
              fi
              echo "::warning::${label} a échoué à la tentative ${attempt}; nouvel essai avec une séquence de port-knocking fraîche." >&2
              sleep $((attempt * 5))
            done
          }

          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          scp_options=(-i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)

          retry_after_knock "Préparation du répertoire distant" ssh "${ssh_options[@]}" "$remote" "install -d -m 700 '$remote_dir'"
          retry_after_knock "Transfert des archives" scp "${scp_options[@]}" \
            "compatair-${GITHUB_SHA}.tar.gz" "compatair-${GITHUB_SHA}.tar.gz.sha256" \
            "compatair-admin-${GITHUB_SHA}.tar.gz" "compatair-admin-${GITHUB_SHA}.tar.gz.sha256" \
            scripts/deploy-remote.sh \
            "${remote}:${remote_dir}/"
          retry_after_knock "Activation de la release" ssh "${ssh_options[@]}" "$remote" \
            "cd '$remote_dir' && sha256sum --check 'compatair-admin-${GITHUB_SHA}.tar.gz.sha256' && tar -xzf 'compatair-admin-${GITHUB_SHA}.tar.gz' && bash '$remote_dir/deploy-remote.sh' '$remote_dir/compatair-${GITHUB_SHA}.tar.gz' '$remote_dir/compatair-${GITHUB_SHA}.tar.gz.sha256' '$DEPLOY_PATH' '$GITHUB_SHA'"

      - name: Verify live HTTPS surface
        env:
          MCP_ENABLED: ${{ vars.MCP_ENABLED }}
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 20 https://compatair.fr/ > /dev/null
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/robots.txt | grep -Fq 'https://compatair.fr/sitemap-index.xml'
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/sitemap-index.xml > /dev/null
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/scanner/ | grep -Fq 'Scanner et vérifier'
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/professionnels/ | grep -Fq 'Widget marchand'
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/widget/v1.0.0/compatair-widget.js | grep -Fq 'CompatAir widget API v1'
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/data/catalog.json | grep -Fq 'catalogVersion'
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/data/verdicts.json | grep -Fq 'verdictVersion'
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/data/signatures.json | grep -Fq 'compatair-2026-01'
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/data/signing-keys.json | grep -Fq 'Ed25519'
          if [[ "$MCP_ENABLED" == "true" ]]; then
            health=$(curl --fail --silent --show-error --max-time 20 https://compatair.fr/mcp-health)
            grep -Fq '"status":"ok"' <<< "$health"
            grep -Fq '"verdictVersion"' <<< "$health"
            curl --fail --silent --show-error --max-time 20 \
              'https://compatair.fr/api/v1/compatibility?compressorId=einhell-tc-ac-240-50-10-of&toolId=einhell-tc-pe-150' \
              | grep -Fq '"schemaVersion":"1.0.0"'
          fi

      - name: Archive signed production invariants
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatair-invariants-${{ github.sha }}
          path: |
            dist/data/evidence-history.json
            dist/data/signatures.json
            dist/data/signing-keys.json
            dist/widget/v1.0.0/compatair-widget.js
            config/immutable-assets.json
          if-no-files-found: error
          retention-days: 90
    environment:
      name: production
      url: https://compatair.fr

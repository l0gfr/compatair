name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Install pnpm
        run: npm install --global pnpm@10.34.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source and workflow policy
        run: pnpm lint:source

      - name: Validate source, tests, build and snapshots
        run: pnpm validate:full

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Check generated HTML and internal links
        run: node scripts/audit-dist.mjs

      - name: Package immutable release
        run: |
          install -D -m 644 server/mcp-core.mjs dist/_server/mcp-core.mjs
          install -D -m 644 server/mcp-server.mjs dist/_server/mcp-server.mjs
          tar -C dist -czf "compatair-${GITHUB_SHA}.tar.gz" .
          sha256sum "compatair-${GITHUB_SHA}.tar.gz" > "compatair-${GITHUB_SHA}.tar.gz.sha256"
          tar -czf "compatair-admin-${GITHUB_SHA}.tar.gz" deploy
          sha256sum "compatair-admin-${GITHUB_SHA}.tar.gz" > "compatair-admin-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatair-production-${{ github.sha }}
          path: |
            compatair-${{ github.sha }}.tar.gz
            compatair-${{ github.sha }}.tar.gz.sha256
            compatair-admin-${{ github.sha }}.tar.gz
            compatair-admin-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOCK_PORTS: ${{ secrets.DEPLOY_KNOCK_PORTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_KNOCK_PORTS" =~ ^[0-9]{1,5}(\ [0-9]{1,5})*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/var/www/html/[A-Za-z0-9._/-]+$ ]]
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_dir="/home/${DEPLOY_USER}/compatair-deploy"

          knock_server() {
            read -ra knock_ports <<< "$DEPLOY_KNOCK_PORTS"
            for port in "${knock_ports[@]}"; do
              nc -z -w 1 "$DEPLOY_HOST" "$port" || true
              sleep 1
            done
          }

          knock_server
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" "install -d -m 700 '$remote_dir'"
          knock_server
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "compatair-${GITHUB_SHA}.tar.gz" "compatair-${GITHUB_SHA}.tar.gz.sha256" \
            "compatair-admin-${GITHUB_SHA}.tar.gz" "compatair-admin-${GITHUB_SHA}.tar.gz.sha256" \
            scripts/deploy-remote.sh \
            "${remote}:${remote_dir}/"
          knock_server
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" \
            "cd '$remote_dir' && sha256sum --check 'compatair-admin-${GITHUB_SHA}.tar.gz.sha256' && tar -xzf 'compatair-admin-${GITHUB_SHA}.tar.gz' && bash '$remote_dir/deploy-remote.sh' '$remote_dir/compatair-${GITHUB_SHA}.tar.gz' '$remote_dir/compatair-${GITHUB_SHA}.tar.gz.sha256' '$DEPLOY_PATH' '$GITHUB_SHA'"

      - name: Verify live HTTPS surface
        env:
          MCP_ENABLED: ${{ vars.MCP_ENABLED }}
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 20 https://compatair.fr/ > /dev/null
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/robots.txt | grep -Fq 'https://compatair.fr/sitemap-index.xml'
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/sitemap-index.xml > /dev/null
          curl --fail --silent --show-error --max-time 20 https://compatair.fr/data/catalog.json | grep -Fq 'catalogVersion'
          if [[ "$MCP_ENABLED" == "true" ]]; then
            curl --fail --silent --show-error --max-time 20 https://compatair.fr/mcp-health | grep -Fq '"status":"ok"'
          fi
    environment:
      name: production
      url: https://compatair.fr

name: Security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts pnpm@10.34.4
      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile, registry signatures and install-script policy
        run: pnpm security:registry
      - name: Audit production dependencies
        run: pnpm security:audit
      - name: Record production licenses
        run: pnpm licenses list --prod --json > production-licenses.json
      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-licenses
          path: production-licenses.json
          retention-days: 14

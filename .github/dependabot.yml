version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:20'
      timezone: Europe/Paris
    # Required by Dependabot even though ordinary version-update PRs are disabled.
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    groups:
      npm-security-fixes:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:40'
      timezone: Europe/Paris
    # Required by Dependabot even though ordinary version-update PRs are disabled.
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    groups:
      github-actions-security-fixes:
        applies-to: security-updates
        patterns:
          - '*'
